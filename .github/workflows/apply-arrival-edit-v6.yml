name: Apply arrival edit v6

on:
  push:
    paths:
      - '.github/workflows/apply-arrival-edit-v6.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v6 migration
        run: python tools/apply_arrival_edit_v6.py
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Commit migrated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable editable stock arrival dates [skip ci]"
          git push
