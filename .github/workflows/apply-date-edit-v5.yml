name: Apply date edit v5

on:
  push:
    paths:
      - '.github/workflows/apply-date-edit-v5.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v5 migration
        run: python tools/apply_date_edit_v5.py
      - name: Repair migration separator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  manualPayments:[]\n  actualSales:{}', '  manualPayments:[],\n  actualSales:{}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Commit migrated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable editable scheduled payment dates [skip ci]"
          git push
